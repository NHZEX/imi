name: Coding Standards

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-20.04
    env:
      SWOOLE_VER: 4.7-php7.4
      ENV_SERVICE: swoole-only
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Services
        run: |
          docker-compose -f ./.github/php-only.dc.yml up -d
          docker ps

      - name: Prepare
        run: |
          docker exec swoole-only php -v
          docker exec swoole-only php -m
          docker exec swoole-only php --ri swoole
          docker exec swoole-only composer update --no-interaction --prefer-dist --no-progress
          docker exec swoole-only bash -c "cd split-repository && composer install --no-interaction --prefer-dist --no-progress"

      - name: Coding Standards Tests
        run: docker exec ${ENV_SERVICE} ./vendor/bin/php-cs-fixer fix --dry-run --diff
