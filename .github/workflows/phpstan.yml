name: Static Code Analysis

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-20.04
    env:
      SWOOLE_VER: 4.7-php7.4
      ENV_SERVICE: swoole-only
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Prepare
        run: |
          docker run --rm ghcr.io/nhzex/php-docker2:4.7-php7.4 php -v
          docker run --rm ghcr.io/nhzex/php-docker2:4.7-php7.4 php --ri swoole
          docker-compose -f ./.github/docker-compose.yml up -d ${ENV_SERVICE}
          docker ps
          docker exec ${ENV_SERVICE} php -v \
            && php -m \
            && php --ri swoole \
            && composer -V
          docker exec ${ENV_SERVICE} composer update --no-interaction --prefer-dist --no-progress

      - name: Analyse
        run: |
          docker exec ${ENV_SERVICE} ./vendor/bin/phpstan analyse --memory-limit 1G

      - name: Stop Service
        if: always()
        continue-on-error: true
        run: |
          docker-compose -f ./.github/docker-compose.yml down