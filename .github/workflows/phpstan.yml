name: Static Code Analysis

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-20.04
    env:
      PHP_IMAGE: ghcr.io/nhzex/php-docker2:4.7-php7.4
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Services
        run: |
          docker-compose -f .github/docker-compose.yml up -d swoole-only
          docker ps

      - name: Prepare
        run: |
          docker exec swoole-only php -v
          docker exec swoole-only php -m
          docker exec swoole-only php --ri swoole
          docker exec swoole-only composer update --no-interaction --prefer-dist --no-progress
          docker exec swoole-only bash -c "cd split-repository && composer install --no-interaction --prefer-dist --no-progress"

      - name: Analyse
        run: |
          docker exec swoole-only ./vendor/bin/phpstan analyse --memory-limit 1G